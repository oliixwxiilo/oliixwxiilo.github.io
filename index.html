<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="丑象派软件源添加入口">
<link rel="icon" type="image/jpeg" href="/assets/repo-avatar.jpg">
<title>丑象派</title>
<style>
:root{color-scheme:dark;--bg:#09140f;--panel:#14231b;--line:#30483a;--muted:#a3b8a9;--text:#f1f5ee;--accent:#91c7a5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% -12%,#254b37 0,transparent 52%),var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(520px,100%);text-align:center}
.logo{width:76px;height:76px;object-fit:cover;border:1px solid #45634e;border-radius:22px;background:#14251b;box-shadow:0 5px 18px rgba(0,0,0,.25)}
h1{font-size:30px;line-height:1.2;margin:14px 0 8px}
.url{margin:0 0 28px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
nav{display:grid;gap:12px}
.item{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(20,35,27,.9);color:var(--text);font-weight:650;text-decoration:none;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--accent);transform:translateY(-1px)}
.copy{margin-top:18px;border:0;background:transparent;color:var(--accent);font:inherit;font-size:14px;padding:10px 16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
<img class="logo" src="/assets/repo-avatar.jpg" alt="丑象派">
<h1>丑象派</h1>
<p class="url">https://oliixwxiilo.github.io/</p>
<nav aria-label="添加丑象派软件源">
<a class="item" href="sileo://source/https://oliixwxiilo.github.io/">添加到 Sileo</a>
<a class="item" href="zbra://sources/add/https://oliixwxiilo.github.io/">添加到 Zebra</a>
<a class="item" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://oliixwxiilo.github.io/">添加到 Cydia</a>
<a class="item" href="installer://add/repo=https://oliixwxiilo.github.io/">添加到 Installer</a>
<a class="item" href="apt-repo://https://oliixwxiilo.github.io/">添加到 Saily</a>
</nav>
<button class="copy" type="button" onclick="navigator.clipboard.writeText('https://oliixwxiilo.github.io/').then(()=>{this.textContent='已复制软件源地址'}).catch(()=>{this.textContent='请手动复制上方地址'})">复制软件源地址</button>
</main>
</body>
</html>

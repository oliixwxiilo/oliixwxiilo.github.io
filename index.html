<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="oliixwxiilo 越狱软件源，选择你的软件包管理器添加源。">
<title>oliixwxiilo Repo</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#26364d;--text:#edf3ff;--muted:#9aabc3;--blue:#83adff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1b3558 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,480px);text-align:center}.mark{width:66px;height:66px;margin:0 auto 20px;border:1px solid #405879;border-radius:20px;display:block;object-fit:cover;background:#14243b}
h1{font-size:30px;margin:0 0 8px}.muted{color:var(--muted);margin:0 0 26px}
.panel{padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(18,29,48,.92);box-shadow:0 18px 60px #0004}
.repo{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1423;text-align:left;margin-bottom:18px}
.repo code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;color:#d7e5fa}
button,.store{font:inherit;border:0;border-radius:11px;padding:12px 15px;cursor:pointer}
.copy{background:#263b59;color:#eaf2ff;font-size:14px;white-space:nowrap}
.stores{display:grid;gap:11px}
.store{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:700;background:var(--blue);color:#091426}
.store.secondary{background:#263b59;color:#edf3ff}
.store:active,button:active{transform:scale(.985)}
.note{font-size:12px;color:var(--muted);margin:17px 0 0}
#status{min-height:20px;font-size:12px;color:#9bc8ff;margin-top:8px}
</style>
</head>
<body>
<main>
<img class="mark" src="/CydiaIcon.png" alt="oliixwxiilo Repo 图标">
<h1>oliixwxiilo Repo</h1>
<p class="muted">选择软件包管理器，一键添加软件源</p>
<section class="panel">
<div class="repo"><code id="repo">https://oliixwxiilo.github.io/</code><button class="copy" id="copy" type="button">复制</button></div>
<div class="stores">
<a class="store" href="sileo://source/https://oliixwxiilo.github.io/">添加到 Sileo</a>
<a class="store secondary" href="zbra://sources/add/https://oliixwxiilo.github.io/">添加到 Zebra</a>
<a class="store secondary" href="installer://add/repo=https://oliixwxiilo.github.io/">添加到 Installer</a>
</div>
<p id="status" aria-live="polite"></p>
<p class="note">请在已安装对应软件包管理器的越狱设备上打开此页面。</p>
</section>
</main>
<script>
document.getElementById("copy").addEventListener("click",async()=>{const value=document.getElementById("repo").textContent;try{await navigator.clipboard.writeText(value);document.getElementById("status").textContent="软件源地址已复制"}catch(e){document.getElementById("status").textContent="请长按上方地址手动复制"}});
</script>
</body>
</html>

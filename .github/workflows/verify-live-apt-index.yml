name: Verify Live APT Index

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/verify-live-apt-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every live flat and standard APT index
        shell: bash
        run: |
          set -euo pipefail
          base="https://oliixwxiilo.github.io"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          suffix="?apt_verify=$(date +%s)"

          fetch() {
            local path="$1" output="$2"
            curl --fail --silent --show-error --location \
              --dump-header "$tmp/headers" \
              --write-out "$path HTTP %{http_code}; content-type %{content_type}; bytes %{size_download}\n" \
              "$base/$path$suffix" -o "$output"
            cat "$tmp/headers"
          }

          verify_release() {
            local release="$1" prefix="$2"
            echo "===== Verify $release ====="
            fetch "$release" "$tmp/Release"
            python3 - "$tmp/Release" "$tmp" "$base" "$suffix" "$prefix" <<'PY'
          import hashlib, pathlib, subprocess, sys, urllib.request, gzip
          release_path, tmp, base, suffix, prefix = sys.argv[1:]
          text = pathlib.Path(release_path).read_text()
          sections = {}
          current = None
          for line in text.splitlines():
              if line in ("MD5Sum:", "SHA256:"):
                  current = line[:-1]
                  sections[current] = {}
              elif line and line[0].isspace() and current:
                  fields = line.split()
                  if len(fields) == 3:
                      digest, size, name = fields
                  elif len(fields) == 2:
                      digest, name = fields
                  else:
                      continue
                  sections[current][name] = digest.lower()
              elif line and not line[0].isspace():
                  current = None
          expected = set(sections.get("MD5Sum", {}))
          if not expected or expected != set(sections.get("SHA256", {})):
              raise SystemExit("Release checksum path lists differ or are empty")
          for name in sorted(expected):
              path = (prefix + "/" if prefix else "") + name
              url = base + "/" + path + suffix
              req = urllib.request.Request(url, headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  print(f"{path}: HTTP {response.status}, {len(data)} bytes, {response.headers.get('Content-Type')}")
              for algorithm, table in (("md5", sections["MD5Sum"]), ("sha256", sections["SHA256"])):
                  actual = hashlib.new(algorithm, data).hexdigest()
                  if actual != table[name]:
                      raise SystemExit(f"{algorithm} mismatch for {path}: expected {table[name]}, got {actual}")
              if name.endswith(".gz"):
                  gzip.decompress(data)
          print(f"Verified {len(expected)} files listed by {release}")
          PY
          }

          verify_release "Release" ""
          verify_release "dists/stable/Release" "dists/stable"

          curl --fail --silent --show-error --location "$base/Packages$suffix" -o "$tmp/root-Packages"
          python3 - "$tmp/root-Packages" <<'PY'
          import pathlib, re, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          entries = [x for x in re.split(rb"\n\s*\n", data.strip()) if x.strip()]
          print(f"Root flat Packages entries: {len(entries)}")
          if not entries:
              raise SystemExit("Root Packages index is empty")
          PY
          echo "All live flat and standard APT index checks passed."

name: Verify Live APT Index

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/verify-live-apt-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live Release checksums with live Packages
        shell: bash
        run: |
          set -euo pipefail
          base="https://oliixwxiilo.github.io"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          check_pair() {
            label="$1"
            suffix="$2"
            echo "===== $label ====="
            curl --fail --silent --show-error --location --dump-header "$tmp/Release.headers" --write-out 'Release HTTP %{http_code}; final URL %{url_effective}; content-type %{content_type}; size %{size_download}\n' "$base/Release$suffix" -o "$tmp/Release"
            curl --fail --silent --show-error --location --dump-header "$tmp/Packages.headers" --write-out 'Packages HTTP %{http_code}; final URL %{url_effective}; content-type %{content_type}; size %{size_download}\n' "$base/Packages$suffix" -o "$tmp/Packages"

            expected_md5="$(awk '/^MD5Sum:/{f=1;next} f && $2=="Packages"{print $1;exit}' "$tmp/Release")"
            expected_sha256="$(awk '/^SHA256:/{f=1;next} f && $2=="Packages"{print $1;exit}' "$tmp/Release")"
            actual_md5="$(md5sum "$tmp/Packages" | awk '{print $1}')"
            actual_sha256="$(sha256sum "$tmp/Packages" | awk '{print $1}')"

            echo "$label Release MD5: ${expected_md5:-MISSING}"
            echo "$label Packages MD5: $actual_md5"
            echo "$label Release SHA256: ${expected_sha256:-MISSING}"
            echo "$label Packages SHA256: $actual_sha256"
            echo "$label Packages bytes: $(wc -c < "$tmp/Packages")"
            echo "--- Packages response headers ---"
            cat "$tmp/Packages.headers"
            test -n "$expected_md5"
            test -n "$expected_sha256"
            test "$expected_md5" = "$actual_md5"
            test "$expected_sha256" = "$actual_sha256"
          }

          echo "Checking normal public URLs"
          check_pair "normal" ""
          echo "Checking cache-busted public URLs"
          check_pair "cache-busted" "?apt_verify=$(date +%s)"
          echo "Live APT index verification passed."

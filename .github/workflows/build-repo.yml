name: Build APT Repo
on:
  push:
    branches: [ refactor/modern-apt, main ]
    paths-ignore:
      - Packages
      - Packages.gz
      - Release
      - catalog.json
      - package-audit.json
      - depictions/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip
      - name: Build APT indexes
        run: bash scripts/build-repo.sh
      - name: Validate repository
        run: bash scripts/validate-repo.sh
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release catalog.json package-audit.json depictions
          if git diff --cached --quiet; then
            echo "Indexes are already up to date."
            exit 0
          fi
          git commit -m "Build APT repository indexes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
